<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>ToDoアプリ</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>今日のToDo</h1>

        <ul>
            {% for todo in todos %}

            <li>

                <span
                    class="{% if todo.done %}done{% endif %}">
                    {{ todo.text }}
                </span>

                <div>

                    <a href="/toggle/{{ loop.index0 }}">
                        完了
                    </a>
                    　
                    <a href="/delete/{{ loop.index0 }}">
                        削除
                    </a>

                </div>

            </li>

            {% endfor %}
        </ul>

        <form action="/add" method="post">

            <input
                type="text"
                name="todo"
                placeholder="やることを入力">

            <button type="submit">
                追加
            </button>

        </form>

    </div>

</body>

</html>
